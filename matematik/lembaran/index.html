<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lembaran Darab &amp; Bahagi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: control bar on screen, an A4-shaped sheet below it; only the sheet prints. */
:root{
  --bg:#F2F7F5; --surface:#FFFFFF; --ink:#1D2A31; --muted:#58696F; --line:#D5E4DF; --sun:#F2B33D; --mt:#1F6E94;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#0F191C; --surface:#172529; --ink:#E7F0ED; --muted:#9DB2AC; --line:#2A3F40; --sun:#F5C25B; --mt:#5FAED6; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);line-height:1.1;margin:0}
a{color:inherit}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.head h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800;color:var(--mt)}
.head p{margin:2px 0 14px;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px}
.ctrl label{display:flex;flex-direction:column;font-weight:800;font-size:.85rem;color:var(--muted);gap:4px}
.ctrl select{border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--bg);font-weight:700}
.btn{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer}
.btn.main{background:var(--mt);border-color:var(--mt);color:#fff}
.paper{background:#fff;color:#1D2A31;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:28px 30px;max-width:794px;margin:0 auto;overflow-x:auto}
.paper h2{font-size:1.7rem;font-weight:800}
.meta{margin:8px 0 6px;font-weight:700}
.note{color:#58696F;margin:0 0 12px;font-size:.92rem}
.paper h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:14px 0 6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td{border:1px solid #D5E4DF;padding:9px 8px;white-space:nowrap;font-size:1.05rem}
td b{margin-right:4px}
.blank{display:inline-block;width:38px;border-bottom:1.5px solid #333}
.key td{font-size:.85rem;padding:4px 6px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .ctrl,.head{display:none}
  .wrap{padding:0;max-width:none}
  .paper{box-shadow:none;padding:0;max-width:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><p><a href="../">← Matematik</a></p><h1>Lembaran Darab &amp; Bahagi</h1><p>Buat lembaran baru bila-bila masa, kemudian cetak.</p></div>
  <div class="ctrl">
    <label for="mode">Jenis<select id="mode"><option value="campur">Campur</option><option value="darab">Darab sahaja</option><option value="bahagi">Bahagi sahaja</option></select></label>
    <label for="count">Bilangan<select id="count"><option>20</option><option selected>40</option></select></label>
    <label for="key">Jawapan<select id="key"><option value="show">Tunjuk di bawah</option><option value="hide">Sembunyi</option></select></label>
    <button class="btn" id="new">Soalan baru</button>
    <button class="btn main" id="print">Cetak</button>
  </div>
  <div class="paper" id="paper"></div>
</div>
<script>
const $=id=>document.getElementById(id);
function gen(mode,n){const qs=[],seen=new Set();let g=0;while(qs.length<n&&g++<2000){const a=2+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*8);const div=mode==='bahagi'||(mode==='campur'&&Math.random()<.5);const q=div?[`${a*b} ÷ ${a} =`,b]:[`${a} × ${b} =`,a*b];if(seen.has(q[0]))continue;seen.add(q[0]);qs.push(q)}return qs}
function grid(qs,from){let h='';for(let r=0;r<5;r++){h+='<tr>';for(let c=0;c<4;c++){const i=from+r*4+c;if(i<qs.length)h+=`<td><b>${i+1}.</b> ${qs[i][0]} <span class="blank"></span></td>`}h+='</tr>'}return `<table>${h}</table>`}
let qs=[];
function draw(regen=true){
  if(regen||!qs.length)qs=gen($('mode').value,+$('count').value);
  let h=`<h2>Latihan Darab &amp; Bahagi</h2><p class="meta">Nama: ______________________ &nbsp; Tarikh: ____________ &nbsp; Markah: _____ / ${qs.length}</p><p class="note">Tulis jawapan pada garisan. Nombor yang digunakan ialah 2 hingga 9.</p>`;
  h+=`<h3>Bahagian A</h3>${grid(qs,0)}`;if(qs.length>20)h+=`<h3>Bahagian B</h3>${grid(qs,20)}`;
  if($('key').value==='show'){let k='';for(let r=0;r<Math.ceil(qs.length/8);r++){k+='<tr>';for(let c=0;c<8;c++){const i=r*8+c;if(i<qs.length)k+=`<td>${i+1}. <b>${qs[i][1]}</b></td>`}k+='</tr>'}h+=`<h3>Jawapan</h3><table class="key">${k}</table>`}
  $('paper').innerHTML=h;
}
['mode','count'].forEach(id=>$(id).onchange=()=>draw(true));
$('key').onchange=()=>draw(false);
$('new').onclick=()=>draw(true);
$('print').onclick=()=>window.print();
draw();
</script>
</body>
</html>
