<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maths · Safiyyah Belajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: topic list (Year 2 topical practice) -> one question at a time with choices or a keypad -> result with mistakes to review. */
:root{
  --bg:#F2F7F5; --surface:#FFFFFF; --ink:#1D2A31; --muted:#58696F; --line:#D5E4DF; --sun:#F2B33D;
  --mt:#1F6E94; --mt-soft:#E2EEF5; --good:#278A4C; --good-bg:#E3F4E8; --bad:#C8463F; --bad-bg:#FBE7E5;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F191C; --surface:#172529; --ink:#E7F0ED; --muted:#9DB2AC; --line:#2A3F40; --sun:#F5C25B;
  --mt:#5FAED6; --mt-soft:#16303C; --good:#5CCB83; --good-bg:#173525; --bad:#F07E77; --bad-bg:#3A1F1E; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.crumb{display:inline-block;margin-bottom:14px;font-weight:800;color:var(--muted);text-decoration:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top svg{width:60px;height:60px;flex:none}
.top h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800;color:var(--mt)}
.top p{margin:0;color:var(--muted);font-size:.95rem}
.top a{color:inherit}
.snd{margin-left:auto;flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px}
.lbl{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0 0 8px}
.topics{display:grid;gap:10px}
.tp{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;transition:transform .15s,border-color .15s}
.tp:hover{transform:translateY(-2px);border-color:var(--mt)}
.tp .ic{width:48px;height:48px;flex:none;border-radius:14px;background:var(--mt);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.35rem}
.tp.mix .ic{background:var(--sun);color:#1D2A31}
.tp b{display:block;font-family:var(--display);font-size:1.2rem;line-height:1.15}
.tp small{display:block;color:var(--muted);font-size:.88rem;line-height:1.3}
.tp .st{margin-left:auto;flex:none;font-size:1rem;letter-spacing:1px;color:var(--line)}
.tp .st .on{color:var(--sun)}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:800;font-variant-numeric:tabular-nums}
.prog{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mt);transition:width .3s}
.tag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mt);background:var(--mt-soft);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.q{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,5.4vw,1.7rem);line-height:1.25;margin:0 0 10px;font-variant-numeric:tabular-nums}
.q.story{font-family:var(--body);font-size:1.15rem;font-weight:700}
.eq{font-family:var(--display);font-weight:800;font-size:clamp(2rem,10vw,3rem);text-align:center;line-height:1.15;font-variant-numeric:tabular-nums;margin:4px 0;overflow-wrap:anywhere}
.ans{display:inline-block;min-width:1.8em;border-bottom:5px solid var(--mt);color:var(--mt)}
.fig{display:flex;justify-content:center;margin:6px 0 10px}
.fig svg{max-width:100%;height:auto}
.fig .shape{width:150px}
.fig .line{width:100%}
.fig .strip{width:100%;max-width:340px}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grp{border:2px dashed var(--mt);border-radius:14px;padding:6px 8px;font-size:1.5rem;line-height:1.1;max-width:160px;text-align:center}
.pile{font-size:1.6rem;line-height:1.25;text-align:center;max-width:360px;letter-spacing:2px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em;font-variant-numeric:tabular-nums}
.fr span:first-child{border-bottom:.08em solid currentColor;padding:0 .12em .06em}
.fr span:last-child{padding-top:.06em}
.ch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
.ch button{display:flex;align-items:center;gap:10px;text-align:left;min-height:56px;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 12px;font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ch button .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--mt);color:#fff;font-size:.95rem}
.ch.long{grid-template-columns:1fr}
.ch.long button{font-size:1.2rem;min-height:50px}
.ch button.right{background:var(--good-bg);border-color:var(--good)}
.ch button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ch button:disabled{cursor:default}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 0;min-height:52px;font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums}
.pad .ok{background:var(--mt);border-color:var(--mt);color:#fff;font-size:1.25rem}
.pad button:disabled{opacity:.4}
.fb{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;border-radius:16px;padding:12px 14px;border:2px solid var(--line)}
.fb svg{width:50px;height:50px;flex:none}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb b{font-family:var(--display);font-size:1.25rem;display:block}
.fb .t{flex:1 1 160px;min-width:0}
.fb .next{flex:1 0 100%;border:0;background:var(--mt);color:#fff;border-radius:999px;padding:10px;font-weight:800;font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:800}
.btn.main{background:var(--mt);border-color:var(--mt);color:#fff}
.result{text-align:center}
.result svg{width:100px;height:100px}
.big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--mt);font-variant-numeric:tabular-nums}
.stars{font-size:2.4rem;letter-spacing:6px;color:var(--line)}
.stars .on{color:var(--sun)}
.wrongs{text-align:left;margin-top:12px}
.wrongs div{border-bottom:1px dashed var(--line);padding:6px 2px;font-weight:700}
.wrongs div span{color:var(--good);font-weight:800}
.result .row{justify-content:center}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:.85rem}
/* explosion shown on a wrong answer */
#boom{position:fixed;inset:0;z-index:60;pointer-events:none;display:none;place-items:center;background:radial-gradient(circle,rgba(255,236,150,.95) 0,rgba(255,140,40,.85) 28%,rgba(200,40,20,.55) 52%,rgba(0,0,0,0) 75%)}
#boom.go{display:grid;animation:flash .9s ease-out forwards}
#boom svg{width:min(80vw,420px);height:auto;animation:burst .9s ease-out forwards}
@keyframes flash{0%{opacity:0}8%{opacity:1}70%{opacity:.85}100%{opacity:0}}
@keyframes burst{0%{transform:scale(.2) rotate(-8deg)}25%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1.3) rotate(0)}}
.shake{animation:shake .5s linear}
@keyframes shake{0%,100%{transform:translate(0,0)}10%{transform:translate(-12px,6px)}20%{transform:translate(11px,-8px)}30%{transform:translate(-9px,-5px)}40%{transform:translate(8px,7px)}50%{transform:translate(-6px,4px)}60%{transform:translate(5px,-4px)}70%{transform:translate(-3px,3px)}80%{transform:translate(2px,-2px)}}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
@media (pointer:coarse){.btn,.snd,.crumb{min-height:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#boom.go{opacity:.9}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="boom" aria-hidden="true"><svg viewBox="0 0 200 200"><path d="M100 4 L118 62 L172 26 L142 80 L196 92 L144 112 L178 164 L120 136 L104 196 L86 138 L30 172 L60 116 L4 104 L58 84 L24 32 L82 62 Z" fill="#FFD23F" stroke="#E2401C" stroke-width="6" stroke-linejoin="round"/><text x="100" y="114" text-anchor="middle" font-family="Baloo 2,Trebuchet MS,sans-serif" font-weight="800" font-size="40" fill="#C2181B">BOOM!</text></svg></div>
<script>
function cat(m){return `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 40 L22 10 L44 28 Z" fill="#F0A64A"/><path d="M82 40 L78 10 L56 28 Z" fill="#F0A64A"/><path d="M24 34 L25 18 L37 28 Z" fill="#F7C9D0"/><path d="M76 34 L75 18 L63 28 Z" fill="#F7C9D0"/><ellipse cx="50" cy="56" rx="36" ry="32" fill="#F5B861"/><path d="M50 26 q-4 8 0 14 q4 -6 0 -14" fill="#E08F2E"/><ellipse cx="50" cy="66" rx="17" ry="12" fill="#FFF3E2"/>${m==='sad'?'<circle cx="38" cy="49" r="4.5" fill="#3a2a22"/><circle cx="62" cy="49" r="4.5" fill="#3a2a22"/><path d="M42 66 q8 -6 16 0" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/>':'<path d="M33 49 q5 -6 10 0 M57 49 q5 -6 10 0" fill="none" stroke="#3a2a22" stroke-width="3.5" stroke-linecap="round"/><path d="M42 62 q8 9 16 0" fill="none" stroke="#3a2a22" stroke-width="3" stroke-linecap="round"/><circle cx="28" cy="62" r="5" fill="#F7A8B3" opacity=".7"/><circle cx="72" cy="62" r="5" fill="#F7A8B3" opacity=".7"/>'}<path d="M46 57 h8 l-4 4 z" fill="#E86A7E"/><path d="M22 60 h-14 M22 65 h-13 M78 60 h14 M78 65 h13" stroke="#3a2a22" stroke-width="1.6" stroke-linecap="round"/></svg>`}

/* ---------- storage ---------- */
const KEY='mathsPractice.v1';let store={sound:true,best:{}};
try{store=Object.assign(store,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};

/* ---------- sound effects (made with Web Audio, no files) ---------- */
let ax=null;
function actx(){
  try{
    if(navigator.audioSession)navigator.audioSession.type='playback'; // iPad: play even in silent mode
    if(!ax){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ax=new AC()}
    if(ax.state==='suspended')ax.resume();
    return ax;
  }catch(e){return null}
}
function ding(){
  const c=store.sound&&actx();if(!c)return;const t=c.currentTime+.02;
  [[880,0],[1320,.12]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.35,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+.45);o.connect(g);g.connect(c.destination);o.start(t+d);o.stop(t+d+.5)});
}
// a falling whistle, then a loud blast: noise through a closing low-pass, a deep thump, and distortion for grit
function boomSound(){
  const c=store.sound&&actx();if(!c)return 0;
  const t=c.currentTime+.02,b=t+.36;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=0;comp.ratio.value=12;comp.attack.value=.002;comp.release.value=.25;
  const dist=c.createWaveShaper(),curve=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;curve[i]=Math.tanh(3*x)}dist.curve=curve;
  const out=c.createGain();out.gain.value=1;dist.connect(comp);comp.connect(out);out.connect(c.destination);
  const w=c.createOscillator(),wg=c.createGain();w.type='sine';w.frequency.setValueAtTime(1900,t);w.frequency.exponentialRampToValueAtTime(450,b);
  wg.gain.setValueAtTime(.0001,t);wg.gain.exponentialRampToValueAtTime(.3,t+.05);wg.gain.setValueAtTime(.3,b-.04);wg.gain.exponentialRampToValueAtTime(.0001,b);
  w.connect(wg);wg.connect(comp);w.start(t);w.stop(b+.05);
  const len=Math.floor(c.sampleRate*2.4),buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=c.createBufferSource();n.buffer=buf;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=.8;lp.frequency.setValueAtTime(5000,b);lp.frequency.exponentialRampToValueAtTime(90,b+1.8);
  const ng=c.createGain();ng.gain.setValueAtTime(.0001,b);ng.gain.exponentialRampToValueAtTime(2,b+.008);ng.gain.exponentialRampToValueAtTime(.0001,b+2.2);
  n.connect(lp);lp.connect(ng);ng.connect(dist);n.start(b);n.stop(b+2.4);
  const o=c.createOscillator(),og=c.createGain();o.type='sine';o.frequency.setValueAtTime(150,b);o.frequency.exponentialRampToValueAtTime(28,b+.9);
  og.gain.setValueAtTime(.0001,b);og.gain.exponentialRampToValueAtTime(2.5,b+.01);og.gain.exponentialRampToValueAtTime(.0001,b+1.3);
  o.connect(og);og.connect(dist);o.start(b);o.stop(b+1.4);
  return 360;
}
function explode(){
  const delay=boomSound();
  setTimeout(()=>{
    const el=document.getElementById('boom');el.classList.remove('go');void el.offsetWidth;el.classList.add('go');
    app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');
    try{navigator.vibrate&&navigator.vibrate([350,80,200])}catch(e){}
  },delay);
}

/* ---------- helpers ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fr=(k,n)=>`<span class="fr"><span>${k}</span><span>${n}</span></span>`;
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words(n){if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');const r=n%100;return ONES[Math.floor(n/100)]+' hundred'+(r?' and '+words(r):'')}
const PARTS={2:['half','halves'],3:['third','thirds'],4:['quarter','quarters'],5:['fifth','fifths'],6:['sixth','sixths'],7:['seventh','sevenths'],8:['eighth','eighths'],9:['ninth','ninths'],10:['tenth','tenths']};
const frWords=(k,n)=>ONES[k]+'-'+PARTS[n][k===1?0:1];
const distinct3=()=>{const d=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,3);return d};
// q: {tag, q (prompt html), story, fig, eq, ans (number, keypad) | choices+right (multiple choice), long, explain, key}
function mc(o,right,wrongs){
  const seen=new Set([right]),w=[];for(const x of wrongs){if(!seen.has(x)){seen.add(x);w.push(x)}if(w.length===3)break}
  const all=shuffle([right,...w]);return Object.assign(o,{choices:all,right:all.indexOf(right)});
}

/* ---------- figures ---------- */
function circleFig(n,k){
  let p='';const cx=60,cy=60,r=54;
  for(let i=0;i<n;i++){const a0=-Math.PI/2+2*Math.PI*i/n,a1=-Math.PI/2+2*Math.PI*(i+1)/n;
    p+=`<path d="M${cx} ${cy} L${(cx+r*Math.cos(a0)).toFixed(2)} ${(cy+r*Math.sin(a0)).toFixed(2)} A${r} ${r} 0 0 1 ${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)} Z" fill="${i<k?'var(--sun)':'var(--surface)'}" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`}
  return `<svg class="shape" viewBox="0 0 120 120" role="img" aria-label="A circle cut into ${n} equal parts with ${k} shaded">${p}</svg>`;
}
function barFig(n,k,label){
  let p='';const W=280/n;for(let i=0;i<n;i++)p+=`<rect x="${10+i*W}" y="8" width="${W}" height="56" fill="${i<k?'var(--sun)':'var(--surface)'}" stroke="var(--ink)" stroke-width="2.5"/>`;
  return `<svg class="strip" viewBox="0 0 300 72" role="img" aria-label="${label||`A bar cut into ${n} equal parts with ${k} shaded`}">${p}</svg>`;
}
// number line 0..10 steps; jumps from 0 forward (mul) or from the end back to 0 (div)
function lineFig(step,jumps,back){
  const x=i=>30+i*58;let s='';
  s+=`<line x1="20" y1="80" x2="620" y2="80" stroke="var(--ink)" stroke-width="3"/>`;
  for(let i=0;i<=10;i++)s+=`<line x1="${x(i)}" y1="70" x2="${x(i)}" y2="90" stroke="var(--ink)" stroke-width="3"/><text x="${x(i)}" y="116" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)" font-family="Nunito,sans-serif">${i*step}</text>`;
  for(let j=0;j<jumps;j++){const a=x(j),b=x(j+1);s+=`<path d="M${a} 74 Q${(a+b)/2} 22 ${b} 74" fill="none" stroke="var(--mt)" stroke-width="3.5"/>`;
    const tip=back?a:b,dir=back?1:-1;s+=`<path d="M${tip} 74 l${dir*9} -12 M${tip} 74 l${dir*12} -2" stroke="var(--mt)" stroke-width="3.5" stroke-linecap="round" fill="none"/>`}
  return `<svg class="line" viewBox="0 0 640 128" role="img" aria-label="A number line counting in ${step}s with ${jumps} jumps">${s}</svg>`;
}
const ITEMS=['🍎','🍓','🐟','⭐','🧁','🍬','🌸','🐣'];

/* ---------- question makers, one list per topic (Year 2 topical practice) ---------- */
const NAMES=['Safiyyah','Aiman','Mei Ling','Daniel','Aisyah','Kavin','Hana','Irfan'];
const T={
 numbers:{name:'Numbers to 1000',icon:'123',desc:'Place value, number words, patterns',make:[
  ()=>{const d=distinct3(),n=d[0]*100+d[1]*10+d[2],p=R(0,2),dig=d[2-p],v=dig*10**p;
    return {q:`What is the value of the digit <b>${dig}</b> in <b>${n}</b>?`,ans:v,explain:`${n} = ${d[0]} hundreds + ${d[1]} tens + ${d[2]} ones, so the ${dig} is worth ${v}.`,key:'pv'+n+p}},
  ()=>{const h=R(1,9),t=R(0,9),o=R(0,9),n=h*100+t*10+o,parts=[h*100,t*10,o].filter(x=>x);
    return {eq:`${parts.join(' + ')} = <span class="ans">?</span>`,q:'Write the number.',ans:n,explain:`${parts.join(' + ')} = ${n}`,key:'ex'+n}},
  ()=>{const h=R(1,9),t=R(0,9),o=R(0,9),n=h*100+t*10+o;
    return {q:`<b>${h}</b> hundreds + <b>${t}</b> tens + <b>${o}</b> ones = ?`,ans:n,explain:`${h*100} + ${t*10} + ${o} = ${n}`,key:'hto'+n}},
  ()=>{const d=distinct3(),n=d[0]*100+d[1]*10+d[2],per=[[0,2,1],[1,0,2],[2,1,0],[1,2,0],[2,0,1]].map(p=>d[p[0]]*100+d[p[1]]*10+d[p[2]]);
    return mc({q:`Which number is <b>“${words(n)}”</b>?`,explain:`${words(n)} = ${n}`,key:'w'+n},String(n),shuffle(per).map(String))},
  ()=>{const n=R(101,999);const fake=[words(n).replace(' hundred',''),words((n%10)*100+Math.floor(n/100)*10+Math.floor(n/10)%10),words(n+10>999?n-10:n+10),words(n+1>999?n-1:n+1)];

const ORDER=['numbers','add','sub','mul','div','frac','dec'];

/* ---------- screens ---------- */
const app=document.getElementById('app');
const N=10;let G=null;
const stars=n=>[1,2,3].map(i=>`<span class="${i<=n?'on':''}">★</span>`).join('');
function header(sub){return `<a class="crumb" href="../">← All subjects</a><div class="top">${cat('happy')}<div><h1>Maths</h1><p>${sub}</p></div><button class="snd" id="snd" aria-pressed="${store.sound}">${store.sound?'🔊 Sound on':'🔇 Sound off'}</button></div>`}
function wireSound(){const b=document.getElementById('snd');b.onclick=()=>{store.sound=!store.sound;save();b.setAttribute('aria-pressed',store.sound);b.textContent=store.sound?'🔊 Sound on':'🔇 Sound off';if(store.sound)ding()}}
function home(){
  G=null;
  const row=(k,name,icon,desc,cls)=>`<button class="tp ${cls||''}" data-t="${k}"><span class="ic">${icon}</span><span><b>${name}</b><small>${desc}</small></span><span class="st">${stars(store.best[k]||0)}</span></button>`;
  app.innerHTML=header('Year 2 practice · 10 questions a round')+`<div class="card"><p class="lbl">Choose a topic</p><div class="topics">
    ${row('mix','Mix of everything','★','A bit of every topic','mix')}
    ${ORDER.map(k=>row(k,T[k].name,T[k].icon,T[k].desc)).join('')}</div></div>
    <p class="foot">Careful! A wrong answer goes BOOM 💥</p>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{actx();start(b.dataset.t)});
  wireSound();
}
function start(topic){
  const qs=[],seen=new Set();let g=0;
  const ks=topic==='mix'?shuffle(ORDER):[topic];
  while(qs.length<N&&g++<400){
    const k=topic==='mix'?ks[qs.length%ks.length]:topic,makers=T[k].make;
    const q=makers[(qs.length+g)%makers.length]();q.topic=k;
    if(seen.has(q.key))continue;seen.add(q.key);qs.push(q);
  }
  G={topic,qs:topic==='mix'?qs:shuffle(qs),i:0,score:0,input:'',done:false,wrong:[]};play();
}
function play(){
  const q=G.qs[G.i];
  let body=`<span class="tag">${T[q.topic].name}</span>`;
  if(q.q)body+=`<p class="q${q.story?' story':''}">${q.q}</p>`;
  if(q.fig)body+=`<div class="fig">${q.fig}</div>`;
  if(q.eq)body+=`<div class="eq">${q.choices?q.eq:q.eq.replace('<span class="ans">?</span>',`<span class="ans">${G.input||'?'}</span>`)}</div>`;
  if(q.choices){
    body+=`<div class="ch${q.long||q.choices.some(c=>c.length>9&&!c.includes('fr'))?' long':''}">${q.choices.map((c,i)=>`<button data-c="${i}" ${G.done?'disabled':''} class="${G.done&&i===q.right?'right':''}${G.done&&i===G.pick&&i!==q.right?' wrong':''}"><span class="k">${'ABCD'[i]}</span><span>${c}</span></button>`).join('')}</div>`;
  }else{
    if(!q.eq)body+=`<div class="eq"><span class="ans">${G.input||'?'}</span></div>`;
    body+=`<div class="pad">${[7,8,9,4,5,6,1,2,3].map(n=>`<button data-n="${n}" ${G.done?'disabled':''}>${n}</button>`).join('')}<button data-del ${G.done?'disabled':''} aria-label="Delete">⌫</button><button data-n="0" ${G.done?'disabled':''}>0</button><button class="ok" data-ok ${G.done||!G.input?'disabled':''}>Check</button></div>`;
  }
  app.innerHTML=header(T[G.topic]?T[G.topic].name:'Mix of everything')+`<div class="hud"><span>${G.i+1}/${N}</span><div class="prog"><i style="width:${G.i/N*100}%"></i></div><span>★ ${G.score}</span></div>
  <div class="card">${body}<div id="fb"></div></div>
  <div class="row" style="justify-content:center"><button class="btn" id="quit">Stop</button></div>`;
  wireSound();
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{G.pick=+b.dataset.c;check(G.pick===q.right)});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(G.input.length<4){G.input+=b.dataset.n;play()}});
  const d=app.querySelector('[data-del]');if(d)d.onclick=()=>{G.input=G.input.slice(0,-1);play()};
  const ok=app.querySelector('[data-ok]');if(ok)ok.onclick=()=>check(+G.input===q.ans);
  document.getElementById('quit').onclick=home;
  if(G.done)fb();
}
function answerText(q){return q.choices?q.choices[q.right]:String(q.ans)}
function check(right){
  const q=G.qs[G.i];G.done=true;G.ok=right;
  if(right){G.score++;ding()}else{G.wrong.push(q);explode()}
  play();
}
const PRAISE=['Well done!','Great!','Excellent!','Clever!','Correct!'];
function fb(){
  const q=G.qs[G.i],last=G.i===N-1,el=document.getElementById('fb');
  el.innerHTML=`<div class="fb ${G.ok?'ok':'no'} pop">${cat(G.ok?'happy':'sad')}<div class="t"><b>${G.ok?pick(PRAISE):'BOOM! The answer is '+answerText(q)}</b>${q.explain}</div><button class="next" id="nx">${last?'See my score':'Next →'}</button></div>`;
  const nx=document.getElementById('nx');nx.focus({preventScroll:true});
  nx.onclick=()=>{if(last)result();else{G.i++;G.input='';G.done=false;G.pick=null;play()}};
}
document.addEventListener('keydown',e=>{
  if(!G||!document.getElementById('fb'))return;const q=G.qs[G.i];
  if(e.key==='Enter'){const nx=document.getElementById('nx');if(nx){e.preventDefault();nx.click()}else if(!q.choices&&G.input&&!G.done)check(+G.input===q.ans);return}
  if(G.done)return;
  if(q.choices){const i='abcd'.indexOf(e.key.toLowerCase());if(i>=0&&i<q.choices.length){G.pick=i;check(i===q.right)}return}
  if(/^[0-9]$/.test(e.key)&&G.input.length<4){G.input+=e.key;play()}else if(e.key==='Backspace'){G.input=G.input.slice(0,-1);play()}
});
function plain(h){const d=document.createElement('div');d.innerHTML=h;d.querySelectorAll('.fr').forEach(f=>f.textContent=f.children[0].textContent+'/'+f.children[1].textContent);return d.textContent.replace(/\s+/g,' ').trim()}
function result(){
  const s=G.score>=9?3:G.score>=7?2:G.score>=5?1:0;
  if((store.best[G.topic]||0)<s){store.best[G.topic]=s;save()}
  const msg=s===3?'Brilliant! The cat is so proud of you!':s===2?'Good job! Nearly 3 stars.':s===1?'Not bad! Try once more.':'Let’s practise again.';
  app.innerHTML=header(T[G.topic]?T[G.topic].name:'Mix of everything')+`<div class="card result pop">${cat(s?'happy':'sad')}<div class="big">${G.score}/${N}</div><div class="stars">${stars(s)}</div><p style="font-weight:800;font-size:1.15rem">${msg}</p>
  ${G.wrong.length?`<div class="wrongs"><p class="lbl">Look at these again</p>${G.wrong.map(q=>`<div>${plain((q.q||'')+' '+(q.eq||'')).replace(/\?$/,'')} → <span>${plain(answerText(q))}</span></div>`).join('')}</div>`:''}
  <div class="row"><button class="btn main" id="again">Play again</button><button class="btn" id="menu">Choose topic</button></div></div>`;
  wireSound();
  document.getElementById('again').onclick=()=>start(G.topic);document.getElementById('menu').onclick=home;
}
home();
</script>
<script src="../music.js"></script>
</body>
</html>
